CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096

# k_event objects are used internally by the erpc_wifi driver
CONFIG_EVENTS=y

# Headroom for erpc_wifi_send_cmd()'s k_calloc (this is Zephyr's k_malloc
# heap, separate from the newlib/libstdc++ heap C++ `new` uses for eRPC
# message buffers - kept for k_calloc safety margin, not a fix for the
# eRPC MemoryError seen on real hardware; see msgq thread stack size instead.
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Detect stack overflow in the (small, hardcoded) eRPC command-processing
# thread rather than silently corrupting the heap.
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y

# Wi-Fi (pulls in the renesas erpc_wifi driver via its devicetree node/shield)
CONFIG_WIFI=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
# Required: erpc_wifi_init() only calls erpc_wifi_init_erpc() (sets up the SPI
# transport/eRPC client/cmd queue) and releases the RA6W1 reset pin when this
# is set. With =n the driver holds RA6W1 in hardware reset and never brings
# the interface up (see erpc_wifi.c's #if defined(CONFIG_NET_CONFIG_AUTO_INIT)).
# NET_CONFIG_AUTO_INIT lives under the NET_CONFIG_SETTINGS menuconfig, so that
# must be enabled too or this setting is dropped as unsatisfied.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y

# Network management events are how the async connect result comes back
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_WIFI_LOG_LEVEL_INF=y
